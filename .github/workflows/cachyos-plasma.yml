name: Build CachyOS Plasma rootfs
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Optional WSX snapshot date (YYYY.M.D); empty uses the current UTC date
        type: string
        default: ''
      pre_release:
        description: Publish a pre-release (leave unchecked to keep a draft)
        type: boolean
        default: false
      revision:
        description: Optional WSX revision; empty selects the next available revision
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: cachyos-plasma-rootfs-manual
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.repository == 'WSLd-wsx/wsx-rootfs' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      completed: ${{ steps.prepare.outputs.completed }}
      build_json: ${{ steps.prepare.outputs.build_json }}
      graphics_selection: ${{ steps.graphics.outputs.selection }}
    steps:
      - name: Require configured source token
        env:
          GH_TOKEN: ${{ secrets.WSLD_TOKEN }}
        run: test -n "$GH_TOKEN" || { echo 'Configure the WSLD_TOKEN repository secret.' >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.WSLD_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select CachyOS snapshot date and next revision
        id: select
        env:
          GH_TOKEN: ${{ secrets.WSLD_TOKEN }}
          WSX_SNAPSHOT: ${{ inputs.snapshot }}
          WSX_REVISION: ${{ inputs.revision }}
        run: python3 scripts/select-cachyos-build.py
      - name: Resolve latest verified CachyOS Plasma graphics and publish matching sources
        id: graphics
        env:
          GH_TOKEN: ${{ secrets.WSLD_TOKEN }}
          WSX_COMPONENT_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private=$(gh api repos/WSLd-wsx/wsx-rootfs --jq '.private')
          case "$private" in
            true) export WSX_PRIVATE_SOURCE=1; publication=--publish-private ;;
            false) export WSX_PRIVATE_SOURCE=0; publication=--publish-public ;;
            *) exit 1 ;;
          esac
          echo "WSX_PRIVATE_SOURCE=$WSX_PRIVATE_SOURCE" >> "$GITHUB_ENV"
          python3 scripts/check-workflow-access.py --repo WSLd-wsx/wsx-rootfs --operation cachyos-candidate
          python3 scripts/desktop_contract.py --check-pin
          mkdir -p out
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          PYTHONPATH=scripts python3 -c 'from component_registry import require_private; require_private()'
          python3 scripts/select-component-origin.py --profile cachyos-plasma --repository WSLd-wsx/wsx-rootfs --output out/component-pin.json
          python3 scripts/prepare-shared-sources.py --profile cachyos-plasma --work out/graphics-sources \
            --component-pin out/component-pin.json --require-current-compatibility "$publication"
          python3 - <<'PYTHON'
          import base64, json, os
          from pathlib import Path
          pin = json.loads(Path('out/component-pin.json').read_text())
          source = json.loads(Path('out/graphics-sources/summary.json').read_text())['public_source']
          selection = json.dumps({'component': pin, 'shared_source': source}, separators=(',', ':'))
          Path('out/graphics-selection.json').write_text(selection)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('selection=' + base64.b64encode(selection.encode()).decode() + '\n')
          PYTHON
          python3 scripts/workflow_component_inputs.py --profile cachyos-plasma --selection out/graphics-selection.json
          python3 scripts/audit-licenses.py
          python3 scripts/reuse-components.py --check-pin --profile cachyos-plasma --repo WSLd-wsx/wsx-rootfs --work out
          python3 scripts/check-shared-sources.py --profile cachyos-plasma
      - name: Resolve and deduplicate immutable inputs
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.WSLD_TOKEN }}
          SNAPSHOT: ${{ steps.select.outputs.snapshot }}
          REVISION: ${{ steps.select.outputs.revision }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-cachyos.py --snapshot "$SNAPSHOT" --revision "$REVISION" --repo WSLd-wsx/wsx-rootfs --output out/build.json
          python3 - <<'PYTHON'
          import base64,json,os
          data=json.load(open('out/build.json'))
          encoded=base64.b64encode(json.dumps(data).encode()).decode()
          if len(encoded)>400000: raise ValueError('Build input exceeds job output limit')
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('completed='+str(data['completed']).lower()+'\n')
              stream.write('build_json='+encoded+'\n')
          PYTHON
  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.completed != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.WSLD_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select source access and verified graphics inputs
        env:
          GH_TOKEN: ${{ secrets.WSLD_TOKEN }}
          GRAPHICS_SELECTION: ${{ needs.prepare.outputs.graphics_selection }}
        run: |
          set -euo pipefail
          private=$(gh api repos/WSLd-wsx/wsx-rootfs --jq '.private')
          case "$private" in
            true) echo 'WSX_PRIVATE_SOURCE=1' >> "$GITHUB_ENV"; export WSX_PRIVATE_SOURCE=1 ;;
            false) echo 'WSX_PRIVATE_SOURCE=0' >> "$GITHUB_ENV"; export WSX_PRIVATE_SOURCE=0 ;;
            *) exit 1 ;;
          esac
          mkdir -p out
          printf '%s' "$GRAPHICS_SELECTION" | base64 --decode > out/graphics-selection.json
          python3 scripts/workflow_component_inputs.py --profile cachyos-plasma --selection out/graphics-selection.json
          python3 scripts/audit-licenses.py
          python3 scripts/check-workflow-access.py --repo WSLd-wsx/wsx-rootfs --operation cachyos-candidate
      - name: Restore resolved inputs
        env:
          BUILD_JSON: ${{ needs.prepare.outputs.build_json }}
        run: |
          python3 - <<'PYTHON'
          import base64,json,os
          from pathlib import Path
          data=json.loads(base64.b64decode(os.environ['BUILD_JSON'],validate=True))
          if data['build_commit'] != os.environ['GITHUB_SHA']:
              raise ValueError('Prepared build commit differs from the workflow commit')
          Path('out').mkdir(exist_ok=True)
          Path('out/build.json').write_text(json.dumps(data,indent=2)+'\n')
          PYTHON
      - name: Admit pinned private graphics components
        env:
          GH_TOKEN: ${{ secrets.WSLD_TOKEN }}
          WSX_COMPONENT_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python3 scripts/reuse-components.py --profile cachyos-plasma --repo WSLd-wsx/wsx-rootfs --work out
      - name: Reclaim unused hosted-runner SDK space
        run: bash scripts/prepare-runner.sh
      - name: Start isolated pinned builder
        run: |
          image=$(python3 -c 'import json; print(json.load(open("components/builder.json"))["image"])')
          docker run -d --name wsx-cachyos-builder --privileged -v "$PWD:/workspace:ro" -v "$PWD/out:/output" "$image" sleep infinity
      - name: Bootstrap signed CachyOS Plasma packages
        run: docker exec wsx-cachyos-builder bash /workspace/distros/cachyos-plasma/bootstrap-rootfs.sh
      - name: Configure and validate Plasma Guest
        run: docker exec wsx-cachyos-builder bash /workspace/distros/cachyos-plasma/configure-rootfs.sh
      - name: Stop the owned isolated builder
        if: always()
        run: |
          if docker container inspect wsx-cachyos-builder >/dev/null 2>&1; then
            docker stop wsx-cachyos-builder
            docker rm wsx-cachyos-builder
          fi
      - name: Verify archive and finalize candidate
        env:
          GH_TOKEN: ${{ secrets.WSLD_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd acl libcap2-bin python3-jsonschema
          python3 scripts/archive_policy.py --repo WSLd-wsx/wsx-rootfs --work out
          sudo --preserve-env=GH_TOKEN,WSX_PRIVATE_SOURCE,GITHUB_SHA,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT /usr/bin/python3 scripts/finalize-cachyos.py out
      - name: Verify candidate and publish
        env:
          GH_TOKEN: ${{ secrets.WSLD_TOKEN }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          set -euo pipefail
          repo=WSLd-wsx/wsx-rootfs
          private=$(gh api "repos/$repo" --jq '.private')
          gate=()
          mode=()
          case "$private:$PRE_RELEASE" in
            true:true) mode=(--private-prerelease) ;;
            true:false) mode=(--private-draft) ;;
            false:true) gate=(--public-candidate); mode=(--public-prerelease) ;;
            false:false) gate=(--public-candidate) ;;
            *) exit 1 ;;
          esac
          python3 scripts/private-artifact-gate.py --repo "$repo" --kind rootfs --work out "${gate[@]}"
          PYTHONPATH="$PWD/scripts" python3 scripts/publish.py --repo "$repo" --directory out/payload "${mode[@]}"
