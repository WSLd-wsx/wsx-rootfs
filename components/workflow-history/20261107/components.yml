name: Private graphics source build
on:
  workflow_dispatch:
    inputs:
      test_only:
        description: Compile only; false retains checked private binary artifacts with sources
        type: boolean
        default: true
      profile:
        type: choice
        options: [omarchy, cachyos-plasma]
        default: omarchy
        description: Paired desktop component profile
permissions:
  contents: read
  packages: write
concurrency:
  group: components-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source and binary workflow access
        id: access
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/check-workflow-access.py --repo "$REPOSITORY" --operation component-build
      - name: Verify existing private component destination
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python3 -c 'from component_registry import require_private; require_private()'
      - name: Build pinned private source closure
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          mkdir -p out
          image=$(python3 -c 'import json; print(json.load(open("components/builder.json"))["image"])')
          python3 scripts/watch-component-build.py out/component-build -- docker run --rm -e PYTHONUNBUFFERED=1 -v "$PWD:/workspace:ro" -v "$PWD/out:/output" "$image" bash /workspace/distros/"$PROFILE"/build-components.sh
      - name: Package paired source-built runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          sudo python3 scripts/package-source-components.py out out/packages
      - name: Require private component artifact checks
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/private-artifact-gate.py --repo "$REPOSITORY" --kind component --work out
      - name: Upload and verify paired private GHCR package
        if: ${{ !inputs.test_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
        run: python3 scripts/component_registry.py out/packages --profile "$PROFILE"
      - name: Preserve optional build diagnostics
        if: ${{ always() && steps.access.outcome == 'success' && github.event.repository.private }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-build-evidence
          path: |
            out/*.json
            out/*.txt
            out/*.conf
            out/component-build/source-build.json
            out/component-build/*/result.json
            out/component-build/*/*.log
            out/component-build/builders/**
            out/component-materials/**
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
      - name: Report build scope
        if: always()
        run: |
          echo 'This job only compiles private components. It does not publish or validate a rootfs.' >> "$GITHUB_STEP_SUMMARY"
          sudo find out -name '*.log' -type f -exec tail -n 30 {} \;
