name: Omarchy rootfs candidate
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      test_only:
        description: Compile only; false publishes the checked public test prerelease with shared sources
        type: boolean
        default: true
      upstream_version:
        description: Official stable release (empty selects highest stable Release)
        type: string
        default: ''
      revision:
        description: WSX revision (0 uses the version-specific recipe mapping)
        type: number
        default: 0
      debug_enabled:
        description: Actor-key SSH diagnostics (no candidate upload or Draft publication)
        type: boolean
        default: false
      retry_run_id:
        description: Retry publication of a completed run's retained payload (leave version/revision at defaults)
        type: string
        default: ''
permissions:
  contents: write
  actions: read
  packages: read
jobs:
  candidate:
    if: inputs.retry_run_id == '' && (github.event_name != 'schedule' || github.event.repository.private)
    permissions:
      contents: write
      actions: read
      packages: read
    uses: ./.github/workflows/build-rootfs.yml
    with:
      distribution_id: wsx-omarchy
      test_only: ${{ github.event_name != 'workflow_dispatch' || inputs.test_only }}
      upstream_version: ${{ inputs.upstream_version || '' }}
      revision: ${{ fromJSON(format('{0}', inputs.revision || 0)) }}
      debug_enabled: ${{ inputs.debug_enabled || false }}
  retry-publication:
    if: inputs.retry_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: private-recovery-${{ inputs.retry_run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source and binary workflow access
        id: access
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/check-workflow-access.py --repo "$REPOSITORY" --operation binary-build
      - name: Recover verified private Draft without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ORIGINAL_RUN: ${{ inputs.retry_run_id }}
        run: python3 scripts/recover-private-prerelease.py --repo "$REPOSITORY" --run-id "$ORIGINAL_RUN"
